name: Package tarball (npm)

on:
  workflow_call:

defaults:
  run:
    shell: bash

jobs:
  build_node:
    name: Build NodeJS binaries on ${{matrix.os}}
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: ${{vars.NODE_VERSION || '22'}}
      - name: Install dependencies
        run: npm i --omit peer --omit optional
      - name: Build x64 binary
        run: npm x -- prebuildify --arch x64
      - name: Set up cross-compilation
        if: runner.os == 'Linux'
        run: |-
          sudo apt-get update
          sudo apt-get install g++-aarch64-linux-gnu
          printf '%s\n' >> "$GITHUB_ENV" \
            'CC=aarch64-linux-gnu-gcc' 'CXX=aarch64-linux-gnu-g++'
      - name: Build arm64 binary
        run: npm x -- prebuildify --arch arm64
      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          path: prebuilds/**
          name: prebuilds-${{runner.os}}
          retention-days: 2

  package:
    name: Package tarball npm
    needs: [build_node]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: ${{vars.NODE_VERSION || '22'}}
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: prebuilds
          pattern: prebuilds-*
          merge-multiple: true
      - name: Check binaries
        run: tree prebuilds
      - name: Create package tarball
        run: npm pack
      - name: Upload package tarball
        uses: actions/upload-artifact@v7
        with:
          path: "*.tgz"
          name: package-tarball
          retention-days: 2
